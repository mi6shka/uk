
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #f8f6fb;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: #302a38;
  font-weight: 400;
}

.poll {
  max-width: 600px;
  margin: 30px auto;
  padding: 34px;
  background: #fff;
  border: 1px solid #eee9f3;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(96,63,153,.05);
}

.tag {
  color: #7958a7;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.8px;
  margin-bottom: 17px;
}

h1 {
  margin: 0 0 25px;
  font-size: 21px;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: -.3px;
}

.option {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 15px;
  margin: 9px 0;
  border: 1px solid #e6e0ed;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.55;
  transition: .2s;
}

.option:hover {
  border-color: #a991cb;
}

.option:has(input:checked) {
  border-color: #603F99;
  background: #f4effa;
}

.option input {
  width: 18px;
  height: 18px;
  margin: 0;
  flex-shrink: 0;
  accent-color: #603F99;
  cursor: pointer;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #603F99;
  color: white;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: #4e3182;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.total {
  color: #603F99;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 23px;
}

.result {
  margin-bottom: 20px;
}

.result-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.5;
}

.result-line strong {
  white-space: nowrap;
  font-weight: 600;
}

.track {
  height: 8px;
  background: #eee8f5;
  border-radius: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: #603F99;
  border-radius: 8px;
  transition: width .4s;
}

.foot {
  margin-top: 17px;
  color: #89818f;
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
}

[hidden] {
  display: none !important;
}

@media (max-width: 480px) {
  .poll {
    padding: 22px;
    margin: 10px auto;
  }

  h1 {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<main class="poll">

  <div class="tag">ОПРОС</div>

  <h1>
    Кто у вас в компании сейчас отвечает
    за уведомления от госорганов?
  </h1>

  <form id="pollForm">
    <div id="options"></div>

    <button id="voteButton" type="submit" disabled>
      Проголосовать
    </button>
  </form>

  <section id="results" hidden aria-live="polite">
    <div id="total" class="total"></div>
    <div id="resultList"></div>
  </section>

  <div id="foot" class="foot">
    Выберите один вариант ответа
  </div>

</main>

<script>
const answers = [
  "директор",
  "секретарь-ассистент",
  "мы, юристы",
  "руководители департаментов по своим направлениям",
  "у нас таких ответственных нет"
];

const COUNTS_KEY = "gov_poll_counts_v1";
const VOTE_KEY = "gov_poll_my_vote_v1";

const form = document.getElementById("pollForm");
const options = document.getElementById("options");
const voteButton = document.getElementById("voteButton");
const results = document.getElementById("results");
const totalElement = document.getElementById("total");
const resultList = document.getElementById("resultList");
const foot = document.getElementById("foot");

function getCounts() {
  try {
    const stored = JSON.parse(
      localStorage.getItem(COUNTS_KEY)
    );

    if (
      Array.isArray(stored) &&
      stored.length === answers.length &&
      stored.every(n => Number.isInteger(n) && n >= 0)
    ) {
      return stored;
    }
  } catch (error) {}

  return answers.map(() => 0);
}

function getMyVote() {
  try {
    const stored = localStorage.getItem(VOTE_KEY);

    if (stored === null) return null;

    const index = Number(stored);

    if (
      Number.isInteger(index) &&
      index >= 0 &&
      index < answers.length
    ) {
      return index;
    }
  } catch (error) {}

  return null;
}

function pluralVotes(n) {
  const last = n % 10;
  const lastTwo = n % 100;

  if (lastTwo >= 11 && lastTwo <= 14) {
    return "голосов";
  }

  if (last === 1) return "голос";
  if (last >= 2 && last <= 4) return "голоса";

  return "голосов";
}

function createOptions() {
  answers.forEach((answer, index) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.value = index;

    const text = document.createElement("span");
    text.textContent = answer;

    label.append(radio, text);
    options.appendChild(label);
  });
}

function showResults() {
  const counts = getCounts();
  const total = counts.reduce((sum, n) => sum + n, 0);

  form.hidden = true;
  results.hidden = false;

  totalElement.textContent =
    `Всего: ${total} ${pluralVotes(total)} ·`;

  resultList.replaceChildren();

  answers.forEach((answer, index) => {
    const count = counts[index];

    const percent = total
      ? Math.round(count / total * 100)
      : 0;

    const row = document.createElement("div");
    row.className = "result";

    const line = document.createElement("div");
    line.className = "result-line";

    const name = document.createElement("span");
    name.textContent = answer;

    const value = document.createElement("strong");
    value.textContent = `${count} · ${percent}%`;

    line.append(name, value);

    const track = document.createElement("div");
    track.className = "track";

    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = `${percent}%`;

    track.appendChild(fill);
    row.append(line, track);
    resultList.appendChild(row);
  });

  foot.textContent =
    "Анонимное голосование";
}

createOptions();

form.addEventListener("change", () => {
  voteButton.disabled = false;
});

form.addEventListener("submit", event => {
  event.preventDefault();

  if (getMyVote() !== null) {
    showResults();
    return;
  }

  const selected = form.querySelector(
    'input[name="answer"]:checked'
  );

  if (!selected) return;

  const index = Number(selected.value);
  const counts = getCounts();

  counts[index] += 1;

  try {
    localStorage.setItem(
      COUNTS_KEY,
      JSON.stringify(counts)
    );

    localStorage.setItem(
      VOTE_KEY,
      String(index)
    );
  } catch (error) {
    foot.textContent =
      "Не удалось сохранить голос";
    return;
  }

  showResults();
});

if (getMyVote() !== null) {
  showResults();
}
</script>

</body>
</html>
