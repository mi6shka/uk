
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опрос</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #FAF9FC;
      color: #393442;
    }

    .poll {
      width: 100%;
      padding: 26px;
      background: #FAF9FC;
      border: 1px solid #E2D9EE;
      border-radius: 18px;
    }

    .poll-label {
      margin-bottom: 14px;
      color: #7958A7;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .poll-title {
      margin: 0 0 24px;
      color: #603F99;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      flex-shrink: 0;
      accent-color: #603F99;
      cursor: pointer;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .vote-button {
      min-width: 195px;
      padding: 14px 26px;
      border: none;
      border-radius: 50px;
      background: #603F99;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      font-style: normal;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .vote-button:hover {
      background: #503282;
    }

    .return-button {
      padding: 11px 22px;
      border: 1px solid #CDBFE0;
      border-radius: 50px;
      background: transparent;
      color: #603F99;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .return-button:hover {
      background: #F0EAF7;
    }

    .results {
      display: none;
    }

    .success {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: #603F99;
      font-size: 16px;
      font-weight: 600;
    }

    .success-icon {
      font-size: 20px;
    }

    .total {
      margin-bottom: 22px;
      color: #603F99;
      font-size: 16px;
      font-weight: 600;
    }

    .result-item {
      margin-bottom: 18px;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }

    .result-number {
      flex-shrink: 0;
      color: #603F99;
      font-weight: 600;
    }

    .bar {
      width: 100%;
      height: 9px;
      background: #E7E0F0;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #603F99;
      border-radius: 20px;
    }

    @media (max-width: 480px) {
      .poll {
        padding: 20px;
      }

      .poll-title {
        font-size: 21px;
      }

      .option {
        font-size: 16px;
      }

      .result-heading {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <section class="poll">

    <div class="poll-label">ОПРОС</div>

    <h2 class="poll-title">
      Кто у вас в компании сейчас отвечает
      за уведомления от госорганов?
    </h2>

    <div id="voting">
      <form id="pollForm">

        <label class="option">
          <input type="radio" name="answer" value="0">
          <span>директор</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="1">
          <span>секретарь-ассистент</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="2">
          <span>мы, юристы</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="3">
          <span>
            руководители департаментов
            по своим направлениям
          </span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="4">
          <span>у нас таких ответственных нет</span>
        </label>

        <div class="button-wrap">
          <button class="vote-button" type="submit">
            Проголосовать
          </button>
        </div>

      </form>
    </div>

    <div id="results" class="results">

      <div class="success">
        <span class="success-icon">✓</span>
        <span>Ваш голос учтен</span>
      </div>

      <div id="total" class="total"></div>
      <div id="resultList"></div>

      <div class="button-wrap">
        <button
          class="return-button"
          id="returnButton"
          type="button"
        >
          Вернуться к опросу
        </button>
      </div>

    </div>

  </section>

  <script>
    const options = [
      "директор",
      "секретарь-ассистент",
      "мы, юристы",
      "руководители департаментов по своим направлениям",
      "у нас таких ответственных нет"
    ];

    const STORAGE_KEY = "gov_poll_votes_v4";
    const VOTED_KEY = "gov_poll_voted_v4";

    function getVotes() {
      try {
        const stored = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        if (
          Array.isArray(stored) &&
          stored.length === options.length &&
          stored.every(
            n => Number.isInteger(n) && n >= 0
          )
        ) {
          return stored;
        }
      } catch (error) {}

      return [0, 0, 0, 0, 0];
    }

    function voteWord(n) {
      if (n % 100 >= 11 && n % 100 <= 14) {
        return "голосов";
      }

      if (n % 10 === 1) {
        return "голос";
      }

      if (n % 10 >= 2 && n % 10 <= 4) {
        return "голоса";
      }

      return "голосов";
    }

    function notifyHeight() {
      window.parent.postMessage(
        {
          type: "poll-resize",
          height: Math.ceil(
            document.documentElement.scrollHeight
          )
        },
        "*"
      );
    }

    function showResults() {
      const votes = getVotes();

      const total = votes.reduce(
        (sum, n) => sum + n, 0
      );

      document.getElementById("voting")
        .style.display = "none";

      document.getElementById("results")
        .style.display = "block";

      document.getElementById("total")
        .textContent =
          `Всего: ${total} ${voteWord(total)} ·`;

      const list = document.getElementById("resultList");
      list.innerHTML = "";

      options.forEach((option, index) => {
        const count = votes[index];

        const percent = total
          ? Math.round(count / total * 100)
          : 0;

        const item = document.createElement("div");
        item.className = "result-item";

        const heading = document.createElement("div");
        heading.className = "result-heading";

        const label = document.createElement("span");
        label.textContent = option;

        const number = document.createElement("span");
        number.className = "result-number";
        number.textContent = `${count} · ${percent}%`;

        heading.append(label, number);

        const bar = document.createElement("div");
        bar.className = "bar";

        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = `${percent}%`;

        bar.appendChild(fill);
        item.append(heading, bar);
        list.appendChild(item);
      });

      notifyHeight();
    }

    document.getElementById("pollForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const selected = document.querySelector(
          'input[name="answer"]:checked'
        );

        if (selected === null) {
          alert("Выберите вариант ответа.");
          return;
        }

        // Один голос на браузер.
        if (
          localStorage.getItem(VOTED_KEY) !== "true"
        ) {
          const index = Number(selected.value);
          const votes = getVotes();

          votes[index] += 1;

          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(votes)
          );

          localStorage.setItem(VOTED_KEY, "true");
        }

        showResults();
      });

    document.getElementById("returnButton")
      .addEventListener("click", function() {
        document.getElementById("results")
          .style.display = "none";

        document.getElementById("voting")
          .style.display = "block";

        document.getElementById("pollForm").reset();

        notifyHeight();
      });

    if (
      localStorage.getItem(VOTED_KEY) === "true"
    ) {
      showResults();
    }

    window.addEventListener("load", notifyHeight);
    window.addEventListener("resize", notifyHeight);

    if ("ResizeObserver" in window) {
      new ResizeObserver(notifyHeight)
        .observe(document.body);
    }
  </script>

</body>
</html>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
