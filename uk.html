
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Опрос</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    body {
      background: #FAF9FC;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #393442;
    }

    .poll {
      width: 100%;
      padding: 26px;
      background: #FAF9FC;
      border: 1px solid #E2D9EE;
      border-radius: 18px;
      height: auto;
      overflow: visible;
    }

    .poll-label {
      margin-bottom: 14px;
      color: #7958A7;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .poll-title {
      margin: 0 0 24px;
      color: #603F99;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.35;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      flex-shrink: 0;
      accent-color: #603F99;
      cursor: pointer;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .vote-button {
      min-width: 195px;
      padding: 14px 26px;
      border: none;
      border-radius: 50px;
      background: #603F99;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      font-style: normal;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .vote-button:hover {
      background: #503282;
    }

    .vote-button:focus-visible {
      outline: 3px solid #B8A6D8;
      outline-offset: 3px;
    }

    .results {
      display: none;
    }

    .total {
      margin-bottom: 22px;
      color: #603F99;
      font-size: 16px;
      font-weight: 600;
    }

    .result-item {
      margin-bottom: 18px;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }

    .result-number {
      flex-shrink: 0;
      color: #603F99;
      font-weight: 600;
    }

    .bar {
      height: 9px;
      background: #E7E0F0;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #603F99;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    @media (max-width: 480px) {
      .poll {
        padding: 20px;
      }

      .poll-title {
        font-size: 21px;
      }

      .option {
        font-size: 16px;
      }

      .result-heading {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <section class="poll">
    <div class="poll-label">ОПРОС</div>

    <h2 class="poll-title">
      Кто у вас в компании сейчас отвечает
      за уведомления от госорганов?
    </h2>

    <div id="voting">
      <form id="pollForm">

        <label class="option">
          <input type="radio" name="answer" value="0">
          <span>директор</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="1">
          <span>секретарь-ассистент</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="2">
          <span>мы, юристы</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="3">
          <span>
            руководители департаментов
            по своим направлениям
          </span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="4">
          <span>у нас таких ответственных нет</span>
        </label>

        <div class="button-wrap">
          <button class="vote-button" type="submit">
            Проголосовать
          </button>
        </div>

      </form>
    </div>

    <div id="results" class="results">
      <div id="total" class="total"></div>
      <div id="resultList"></div>
    </div>
  </section>

  <script>
    const options = [
      "директор",
      "секретарь-ассистент",
      "мы, юристы",
      "руководители департаментов по своим направлениям",
      "у нас таких ответственных нет"
    ];

    const STORAGE_KEY = "gov_poll_votes_v2";
    const VOTED_KEY = "gov_poll_voted_v2";

    function getVotes() {
      try {
        const votes = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        if (
          Array.isArray(votes) &&
          votes.length === options.length &&
          votes.every(
            n => Number.isInteger(n) && n >= 0
          )
        ) {
          return votes;
        }
      } catch (error) {
        // Если данных нет, начинаем с нуля.
      }

      return [0, 0, 0, 0, 0];
    }

    function voteWord(n) {
      if (n % 100 >= 11 && n % 100 <= 14) {
        return "голосов";
      }

      if (n % 10 === 1) {
        return "голос";
      }

      if (n % 10 >= 2 && n % 10 <= 4) {
        return "голоса";
      }

      return "голосов";
    }

    function notifyHeight() {
      const height = Math.ceil(
        document.documentElement.scrollHeight
      );

      // Сообщаем высоту внешней странице.
      window.parent.postMessage(
        {
          type: "poll-resize",
          height: height
        },
        "*"
      );
    }

    function showResults() {
      const votes = getVotes();
      const total = votes.reduce(
        (sum, count) => sum + count, 0
      );

      document.getElementById("voting")
        .style.display = "none";

      document.getElementById("results")
        .style.display = "block";

      document.getElementById("total")
        .textContent =
          `Всего: ${total} ${voteWord(total)} ·`;

      const resultList =
        document.getElementById("resultList");

      resultList.innerHTML = "";

      options.forEach((option, index) => {
        const count = votes[index];

        const percent = total
          ? Math.round(count / total * 100)
          : 0;

        const item = document.createElement("div");
        item.className = "result-item";

        const heading = document.createElement("div");
        heading.className = "result-heading";

        const label = document.createElement("span");
        label.textContent = option;

        const number = document.createElement("span");
        number.className = "result-number";
        number.textContent = `${count} · ${percent}%`;

        heading.append(label, number);

        const bar = document.createElement("div");
        bar.className = "bar";

        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = `${percent}%`;

        bar.appendChild(fill);
        item.append(heading, bar);
        resultList.appendChild(item);
      });

      notifyHeight();
    }

    document.getElementById("pollForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        if (
          localStorage.getItem(VOTED_KEY) === "true"
        ) {
          showResults();
          return;
        }

        const selected = document.querySelector(
          'input[name="answer"]:checked'
        );

        if (!selected) {
          alert("Выберите вариант ответа.");
          return;
        }

        const index = Number(selected.value);
        const votes = getVotes();

        votes[index] += 1;

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(votes)
        );

        localStorage.setItem(VOTED_KEY, "true");

        showResults();
      });

    if (localStorage.getItem(VOTED_KEY) === "true") {
      showResults();
    }

    window.addEventListener("load", notifyHeight);
    window.addEventListener("resize", notifyHeight);

    if ("ResizeObserver" in window) {
      new ResizeObserver(notifyHeight)
        .observe(document.body);
    }
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src='https://zhuzhzha78.github.io/interactive/shablon/iframeResizer.contentWindow.min.js' type="text/javascript"></script>


  </script>

</body>
</html>
