
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опрос</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #393442;
    }

    .poll {
      max-width: 620px;
      margin: 0 auto;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e9e3f0;
      border-radius: 18px;
    }

    .poll-label {
      color: #7958a7;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .poll-title {
      margin: 0 0 25px;
      color: #603f99;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 19px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    .option input {
      margin-top: 5px;
      accent-color: #603f99;
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .vote-button {
      min-width: 195px;
      padding: 14px 25px;
      border: none;
      border-radius: 50px;
      background: #603f99;
      color: #ffffff;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      font-style: normal;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .vote-button:hover {
      background: #503282;
    }

    .vote-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .results {
      display: none;
    }

    .total {
      margin-bottom: 22px;
      color: #603f99;
      font-size: 16px;
      font-weight: 600;
    }

    .result-item {
      margin-bottom: 19px;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }

    .result-number {
      flex-shrink: 0;
      font-weight: 600;
      color: #603f99;
    }

    .bar {
      width: 100%;
      height: 9px;
      background: #eee8f5;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: #603f99;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .poll {
        padding: 20px;
      }

      .poll-title {
        font-size: 21px;
      }

      .option {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="poll">
    <div class="poll-label">ОПРОС</div>

    <h2 class="poll-title">
      Кто у вас в компании сейчас отвечает
      за уведомления от госорганов?
    </h2>

    <div id="voting">
      <form id="pollForm">

        <label class="option">
          <input type="radio" name="answer" value="0">
          <span>директор</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="1">
          <span>секретарь-ассистент</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="2">
          <span>мы, юристы</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="3">
          <span>руководители департаментов по своим направлениям</span>
        </label>

        <label class="option">
          <input type="radio" name="answer" value="4">
          <span>у нас таких ответственных нет</span>
        </label>

        <div class="button-wrap">
          <button class="vote-button" type="submit">
            Проголосовать
          </button>
        </div>

      </form>
    </div>

    <div id="results" class="results">
      <div id="total" class="total"></div>
      <div id="resultList"></div>
    </div>
  </div>

  <script>
    const options = [
      "директор",
      "секретарь-ассистент",
      "мы, юристы",
      "руководители департаментов по своим направлениям",
      "у нас таких ответственных нет"
    ];

    const STORAGE_KEY = "gov_poll_votes_v1";
    const VOTED_KEY = "gov_poll_voted_v1";

    function getVotes() {
      try {
        const stored = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        if (
          Array.isArray(stored) &&
          stored.length === options.length &&
          stored.every(
            n => Number.isInteger(n) && n >= 0
          )
        ) {
          return stored;
        }
      } catch (error) {
        // Используем начальные значения.
      }

      return [0, 0, 0, 0, 0];
    }

    function voteWord(count) {
      const lastTwo = count % 100;
      const last = count % 10;

      if (lastTwo >= 11 && lastTwo <= 14) {
        return "голосов";
      }

      if (last === 1) {
        return "голос";
      }

      if (last >= 2 && last <= 4) {
        return "голоса";
      }

      return "голосов";
    }

    function showResults() {
      const votes = getVotes();
      const total = votes.reduce(
        (sum, count) => sum + count, 0
      );

      document.getElementById("voting").style.display = "none";
      document.getElementById("results").style.display = "block";

      document.getElementById("total").textContent =
        `Всего: ${total} ${voteWord(total)} ·`;

      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      options.forEach((option, index) => {
        const count = votes[index];
        const percent = total > 0
          ? Math.round((count / total) * 100)
          : 0;

        const item = document.createElement("div");
        item.className = "result-item";

        const heading = document.createElement("div");
        heading.className = "result-heading";

        const label = document.createElement("span");
        label.textContent = option;

        const number = document.createElement("span");
        number.className = "result-number";
        number.textContent = `${count} · ${percent}%`;

        heading.append(label, number);

        const bar = document.createElement("div");
        bar.className = "bar";

        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = `${percent}%`;

        bar.appendChild(fill);
        item.append(heading, bar);
        resultList.appendChild(item);
      });
    }

    document.getElementById("pollForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        if (localStorage.getItem(VOTED_KEY) === "true") {
          showResults();
          return;
        }

        const selected = document.querySelector(
          'input[name="answer"]:checked'
        );

        if (!selected) {
          alert("Пожалуйста, выберите вариант ответа.");
          return;
        }

        const index = Number(selected.value);
        const votes = getVotes();

        votes[index] += 1;

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(votes)
        );

        localStorage.setItem(VOTED_KEY, "true");

        showResults();
      });

    if (localStorage.getItem(VOTED_KEY) === "true") {
      showResults();
    }
  </script>

</body>
</html>
